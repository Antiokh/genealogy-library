<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vue Flow + ELK demo</title>
  <link rel="stylesheet" href="./demo.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@vue-flow/core@1.48.2/dist/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@vue-flow/core@1.48.2/dist/theme-default.css">
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@vue-flow/core@1.48.2/dist/vue-flow-core.iife.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/elkjs@0.12.0/lib/elk.bundled.js"></script>
  <style>
    #app, .vue-flow { width: 100%; height: 100%; }
    .vue-flow__node-person, .vue-flow__node-family { border: 0; background: transparent; padding: 0; box-shadow: none; }
    .vue-flow__node-person { width: 184px; }
    .vue-flow__node-family { width: 18px; height: 18px; }
    .vue-flow__handle { width: 1px !important; height: 1px !important; min-width: 1px; min-height: 1px; opacity: 0; border: 0; }
    .vue-flow__edge-path { stroke: #aaa298; stroke-width: 1.35; }
    .union-wrap { width: 18px; height: 18px; position: relative; display: grid; place-items: center; }
  </style>
</head>
<body>
<header>
  <strong>Tree demo</strong>
  <nav>
    <a href="./index.html">Overview</a>
    <a href="./family-chart.html">Family Chart</a>
    <a class="active" href="./vue-flow-elk.html">Vue Flow + ELK</a>
    <a href="./custom-svg.html">Custom SVG</a>
  </nav>
</header>
<main>
  <p class="demo-note">The graph contains explicit family nodes. ELK only calculates positions; Vue Flow owns pan/zoom and lets us render arbitrary HTML cards. The small circle is the union anchor, so children cannot accidentally belong to the wrong spouse.</p>
  <div class="canvas-shell"><div id="app">
    <vue-flow :nodes="nodes" :edges="edges" :fit-view-on-init="true" :min-zoom="0.25" :max-zoom="2" :nodes-draggable="false">
      <template #node-person="{ data }">
        <div class="person-card">
          <handle type="target" :position="Position.Top"></handle>
          <div class="avatar">{{ data.initials }}</div>
          <div>
            <div class="name">{{ data.name }}</div>
            <div class="years">{{ data.years }}</div>
          </div>
          <handle type="source" :position="Position.Bottom"></handle>
        </div>
      </template>
      <template #node-family="{ data }">
        <div class="union-wrap">
          <handle type="target" :position="Position.Top"></handle>
          <div class="union-dot"></div>
          <div v-if="data.label" class="union-label">{{ data.label }}</div>
          <handle type="source" :position="Position.Bottom"></handle>
        </div>
      </template>
    </vue-flow>
  </div></div>
</main>

<script type="module">
  import { family } from './sample-data.js';

  const { createApp, ref } = Vue;
  const { VueFlow, Handle, Position } = VueFlowCore;
  const elk = new ELK();

  const initials = name => name.split(/\s+/).map(s => s[0]).slice(0, 2).join('');

  const rawNodes = [
    ...family.people.map(person => ({
      id: person.id,
      type: 'person',
      width: 184,
      height: 72,
      data: { ...person, initials: initials(person.name) }
    })),
    ...family.families.map(unit => ({
      id: unit.id,
      type: 'family',
      width: 18,
      height: 18,
      data: { label: unit.label || '' }
    }))
  ];

  const rawEdges = [];
  for (const unit of family.families) {
    for (const partner of unit.partners) {
      rawEdges.push({ id: `${partner}-${unit.id}`, source: partner, target: unit.id });
    }
    for (const child of unit.children) {
      rawEdges.push({ id: `${unit.id}-${child}`, source: unit.id, target: child });
    }
  }

  const graph = await elk.layout({
    id: 'root',
    layoutOptions: {
      'elk.algorithm': 'layered',
      'elk.direction': 'DOWN',
      'elk.spacing.nodeNode': '34',
      'elk.layered.spacing.nodeNodeBetweenLayers': '82',
      'elk.edgeRouting': 'ORTHOGONAL',
      'elk.layered.considerModelOrder.strategy': 'NODES_AND_EDGES'
    },
    children: rawNodes.map(n => ({ id: n.id, width: n.width, height: n.height })),
    edges: rawEdges.map(e => ({ id: e.id, sources: [e.source], targets: [e.target] }))
  });

  const positions = Object.fromEntries(graph.children.map(n => [n.id, { x: n.x || 0, y: n.y || 0 }]));
  const nodes = ref(rawNodes.map(n => ({ id: n.id, type: n.type, data: n.data, position: positions[n.id] })));
  const edges = ref(rawEdges.map(e => ({
    ...e,
    type: 'smoothstep',
    style: { stroke: '#aaa298', strokeWidth: 1.35 }
  })));

  createApp({
    components: { VueFlow, Handle },
    setup() { return { nodes, edges, Position }; }
  }).mount('#app');
</script>
</body>
</html>
