<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shared person card</title>
  <link rel="stylesheet" href="./demo.css">
  <style>
    .card-preview {
      max-width: 1100px;
      margin: 40px auto;
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      align-items: flex-start;
    }
    .card-preview figure { margin: 0; }
    .card-preview figcaption {
      margin-top: 8px;
      font-size: 11px;
      color: #827b71;
    }
  </style>
</head>
<body>
<header>
  <strong>Tree demo</strong>
  <nav>
    <a href="./index.html">Overview</a>
    <a class="active" href="./person-card.html">Person card</a>
    <a href="./family-chart.html">Family Chart</a>
    <a href="./balkan-familytree2.html">BALKAN FamilyTreeJS 2</a>
    <a href="./vue-flow-elk.html">Vue Flow + ELK</a>
  </nav>
</header>
<main>
  <p class="demo-note">This is the shared card component. Names can wrap without ellipsis, compound names stay visible, and a changed surname can show the surname at birth separately. The last cards are stress cases.</p>
  <div class="card-preview" id="cards"></div>
</main>
<script type="module">
  import { family } from './sample-data.js';
  import { personCardElementHtml } from './person-card.js';

  const sampleIds = ['P3', 'P4', 'P8', 'P1'];
  const byId = Object.fromEntries(family.people.map(person => [person.id, person]));
  const cards = [
    ...sampleIds.map(id => ({ ...byId[id], label: id })),
    {
      id: 'BIRTH-SURNAME',
      name: 'Мария Попова',
      cardName: 'Мария Назарова',
      birthSurname: 'Попова',
      marriedSurname: 'Назарова',
      years: '1934–2022',
      sex: 'F',
      deceased: true,
      label: 'surname at birth'
    },
    {
      id: 'LONG-RU',
      name: 'Александр-Леонид фон дер Берг-Михайлов',
      years: '1874–1938',
      sex: 'M',
      label: 'compound Cyrillic name'
    },
    {
      id: 'LONG-LATIN',
      name: 'María de la Cruz Fernández García-Santamaría',
      years: '1901–1987',
      sex: 'F',
      label: 'compound Latin name'
    }
  ];

  document.querySelector('#cards').innerHTML = cards.map(person => `
    <figure>
      ${personCardElementHtml(person)}
      <figcaption>${person.label}</figcaption>
    </figure>`).join('');
</script>
</body>
</html>
