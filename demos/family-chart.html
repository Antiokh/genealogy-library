<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Family Chart demo</title>
  <link rel="stylesheet" href="./demo.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/family-chart@0.9.0/dist/styles/family-chart.css">
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <style>
    #FamilyChart { width: 100%; height: 100%; }
    #FamilyChart .card_cont { overflow: visible; filter: none !important; }
    #FamilyChart path.link { stroke: #aaa298; stroke-width: 1.35px; }

    /* Family Chart owns layout and hit targets only. Its legacy card skin must
       not remain visible behind the shared GenealogyPersonCard component. */
    #FamilyChart div.card,
    #FamilyChart div.card.card-male,
    #FamilyChart div.card.card-female,
    #FamilyChart div.card.card-genderless,
    #FamilyChart div.card-inner,
    #FamilyChart .genealogy-card-host {
      width: 240px !important;
      height: 120px !important;
      min-height: 120px !important;
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      border-radius: 0 !important;
      outline: 0 !important;
      background: transparent !important;
      background-color: transparent !important;
      box-shadow: none !important;
      filter: none !important;
      color: inherit !important;
    }
    #FamilyChart div.card::before,
    #FamilyChart div.card::after,
    #FamilyChart div.card-inner::before,
    #FamilyChart div.card-inner::after {
      display: none !important;
      content: none !important;
    }
  </style>
</head>
<body>
<header>
  <strong>Tree demo</strong>
  <nav>
    <a href="./index.html">Overview</a>
    <a href="./person-card.html">Person card</a>
    <a class="active" href="./family-chart.html">Family Chart</a>
    <a href="./balkan-familytree2.html">BALKAN FamilyTreeJS 2</a>
    <a href="./vue-flow-elk.html">Vue Flow + ELK</a>
  </nav>
</header>
<main>
  <p class="demo-note">Family Chart owns the genealogy layout only. By default this page renders the real MyHeritage snapshot centered on Anton; append <code>?sample=1</code> to return to the synthetic fixture. Every node is the shared PersonCard.</p>
  <div class="canvas-shell"><div id="FamilyChart" class="f3"></div></div>
</main>
<script type="module">
  import * as f3 from 'https://esm.sh/family-chart@0.9.0';
  import { family } from './demo-data.js';
  import { toFamilyChartData } from './renderer-adapters.js';
  import { personCardElementHtml } from './person-card.js';

  const data = toFamilyChartData(family);

  const chart = f3.createChart('#FamilyChart', data)
    .setTransitionTime(0)
    .setCardXSpacing(286)
    .setCardYSpacing(172);

  chart.setCardHtml()
    .setCardInnerHtmlCreator(d => {
      const p = d.data.data;
      const sourceName = [p['first name'], p['last name']].filter(Boolean).join(' ');
      return `<div class="card-inner genealogy-card-host">${personCardElementHtml({
        id: d.data.id,
        name: sourceName,
        cardName: p.cardName || '',
        birthSurname: p.birthSurname || '',
        marriedSurname: p.marriedSurname || '',
        years: p.years || '',
        sex: p.sex || p.gender || '',
        deceased: Boolean(p.deceased),
        photo: p.photo || ''
      })}</div>`;
    });

  chart.updateTree({ initial: true, main_id: family.root });
</script>
</body>
</html>
